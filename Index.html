<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>College Course Management</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f6fb;
            color: #263247;
        }

        header {
            background: #172554;
            color: white;
            padding: 22px 7%;
        }

        header h1 {
            font-size: 25px;
        }

        header p {
            color: #cbd5e1;
            margin-top: 6px;
        }

        main {
            max-width: 1150px;
            margin: 35px auto;
            padding: 0 20px;
        }

        h2 {
            margin-bottom: 10px;
        }

        h3 {
            margin-bottom: 18px;
        }

        .muted {
            color: #718096;
            margin-top: 6px;
        }

        .login-card {
            background: white;
            max-width: 420px;
            margin: 40px auto;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0,0,0,.07);
        }

        .login-card h2 {
            text-align: center;
            margin-top: 12px;
        }

        .login-card > p {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-icon {
            font-size: 45px;
            text-align: center;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 15px 0 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d8deea;
            border-radius: 7px;
            outline: none;
            margin-bottom: 12px;
            font-size: 14px;
        }

        input:focus {
            border-color: #2563eb;
        }

        .btn {
            border: none;
            padding: 11px 17px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .primary:hover {
            background: #1d4ed8;
        }

        .danger {
            background: #fee2e2;
            color: #b91c1c;
        }

        .danger:hover {
            background: #fecaca;
        }

        .full {
            width: 100%;
            margin-top: 10px;
        }

        .small {
            padding: 8px 11px;
        }

        .demo {
            margin-top: 25px;
            padding: 15px;
            background: #eff6ff;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.8;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin: 20px 0;
        }

        .stat-card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,.04);
        }

        .stat-card p {
            color: #718096;
            margin-top: 10px;
        }

        .stat-card h2 {
            font-size: 28px;
            margin-top: 8px;
        }

        .stat-icon {
            font-size: 28px;
        }

        .panel {
            background: white;
            padding: 25px;
            margin-bottom: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,.04);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr) auto;
            gap: 10px;
        }

        .form-grid input {
            margin: 0;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            min-width: 500px;
        }

        th {
            background: #eff4ff;
            color: #334155;
            text-align: left;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #e7ebf2;
            font-size: 14px;
        }

        tr:hover td {
            background: #fafcff;
        }

        .inline-form {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 0;
        }

        .inline-form input {
            width: 120px;
            margin: 0;
            padding: 8px;
        }

        .welcome {
            background: #eaf1ff;
        }

        .welcome h3 {
            color: #1d4ed8;
            margin-bottom: 8px;
        }

        .welcome h2 {
            color: #1d4ed8;
            margin-top: 15px;
        }

        .search-form {
            display: flex;
            gap: 10px;
            max-width: 550px;
            margin-bottom: 20px;
        }

        .search-form input {
            margin: 0;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-top: 20px;
        }

        .course-card {
            border: 1px solid #e5eaf2;
            padding: 20px;
            border-radius: 10px;
            background: #fff;
        }

        .course-card h3 {
            margin: 12px 0 18px;
        }

        .course-icon {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .course-id {
            font-size: 12px;
            color: #64748b;
            background: #f1f5f9;
            padding: 5px 9px;
            border-radius: 5px;
        }

        .enrolled {
            color: #15803d;
            font-size: 13px;
            font-weight: bold;
        }

        .message {
            background: #eff6ff;
            border-left: 4px solid #2563eb;
            padding: 13px 18px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        footer {
            text-align: center;
            color: #718096;
            padding: 25px;
            font-size: 13px;
        }

        @media(max-width: 750px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .course-grid {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .topbar {
                align-items: flex-start;
            }

            .login-card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🎓 College Course Management</h1>
    <p>Student and Admin Portal</p>
</header>

<main>

    <div class="message">
        {{MESSAGE}}
    </div>

    {{CONTENT}}

</main>

<footer>
    College Course Management System | Mini Project
</footer>

</body>
</html>
